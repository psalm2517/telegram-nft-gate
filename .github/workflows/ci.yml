name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The frontend must exist before the Worker builds or tests run: the
      # Worker serves web/dist as its static assets.
      - run: pnpm run build:web

      - run: pnpm run lint

      - run: pnpm run typecheck

      - run: pnpm test

      - run: pnpm run build:worker

# This workflow deliberately only checks; it does not deploy.
#
# Deploying from here as well as from Cloudflare's own Workers Builds (which is
# connected to this repo and is the active deploy path) meant two `wrangler
# deploy` runs racing each other on every push to main. One pipeline is enough.
# See docs/deployment.md for how deploys actually happen, and for how to move
# them here instead if you would rather keep CI/CD in one place.
